<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <!-- navbar here -->
        <nav>
            <div class="logo">
                <h2>ScaleX</h2>
            </div>

            <ul>
                <a>Home</a>
                <a>About Us</a>
                <a>Blogs</a>
                <a>Contact Us</a>
            </ul>

            <button class="btn">Get Started</button>
        </nav>

        <section class = "hero">
            <h1>Insights & Blogs</h1>
        </section>

        <div class="categories">
            <button class="active">All</button>
            <button class="cat">Tech</button>
            <button class="cat">SaaS</button>
            <button class="cat">Marketing</button>
        </div>
        

        
        <div class="cards">

            
            <div class="card" >
                <img class="card-img-top" src="./Tech.png" alt="Card image cap">
                <div class="card-body">
                    <h5 class="card-title">Tech</h5>
                    <span class="content"> The Ultimate Guide To SaaS Marketing</span>
                    <p class="card-date">May 23,2025</p>
                    <!-- <p class="card-text"> The Ultimate Guide To SaaS Marketing</p> -->
                    <!-- <a href="#" class="btn btn-primary">Go somewhere</a> -->
                </div>
            </div>
            <div class="card"  >
                <img class="card-img-top" src="./SaaS.png" alt="Card image cap">
                <div class="card-body">
                    <h5 class="card-title">SaaS</h5>
                    <span class="content">5 Key Trends In SaaS Growth For 2025</span>

                    <p class="card-date">May 23,2025</p>
                    <!-- <a href="#" class="btn btn-primary">Go somewhere</a> -->
                </div>
            </div>
            <div class="card" >
                <img class="card-img-top" src="./Marketing.png" alt="Card image cap">
                <div class="card-body">
                    <h5 class="card-title">Marketing</h5>
                    <span class="content">How Data-Driven Strategies Are Important</span>
                    <p class="card-date">May 23,2025</p>
                    <!-- <a href="#" class="btn btn-primary">Go somewhere</a> -->
                </div>
            </div>
             

        </div>

    </div>

</html>
